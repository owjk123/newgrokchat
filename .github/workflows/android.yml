name: Android Build

on:
  push:
    branches: [ main, 'upgrade/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept Android SDK Licenses
      run: yes | sdkmanager --licenses || true
    
    - name: Setup Gradle
      run: |
        chmod +x gradlew
    
    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache
    
    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon --no-build-cache --no-configuration-cache
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: grokchat-debug-v${{ github.run_number }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: grokchat-release-v${{ github.run_number }}
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
